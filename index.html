<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجلة الاقتدار الإلكترونية</title>
    
    <!-- رابط أيقونة الموقع والتطبيق بالشعار الجديد -->
    <link rel="icon" type="image/jpeg" href="IMG-20261001-WA0001.jpg">
    <link rel="apple-touch-icon" href="IMG-20261001-WA0001.jpg">
    
    <!-- إعدادات شاشة التطبيق الهواتف -->
    <meta name="theme-color" content="#123b68">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="الاقتدار">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; font-family: Tahoma, Arial, sans-serif; background: #f4f7fb; color: #172033; }
        header { background: linear-gradient(135deg, #123b68, #1c78a8); color: white; padding: 28px 18px; text-align: center; }
        .logo { width: 95px; height: 95px; border-radius: 50%; object-fit: cover; border: 4px solid white; margin-bottom: 10px; }
        .school { font-size: 24px; font-weight: bold; }
        .mag { font-size: 18px; opacity: 0.95; }
        .container { max-width: 1100px; margin: auto; padding: 22px 14px; text-align: center; }
        .hero { background: white; border-radius: 22px; padding: 25px; box-shadow: 0 4px 18px #00000012; margin-bottom: 20px; }
        .hero h1 { margin: 5px 0 10px; color: #123b68; font-size: 28px; }
        .hero p { font-size: 16px; line-height: 1.8; color: #555; }
    </style>
</head>
<body>

    <header>
        <img src="IMG-20261001-WA0001.jpg" alt="شعار مدرسة الاقتدار" class="logo">
        <div class="school">مدرسة الاقتدار الابتدائية للبنين</div>
        <div class="mag">مجلة الاقتدار الإلكترونية</div>
    </header>

    <div class="container">
        <div class="hero">
            <h1>أهلاً بكم في مجلة الاقتدار الإلكترونية</h1>
            <p>المجلة الإلكترونية الرسمية لمدرسة الاقتدار الابتدائية للبنين، لمتابعة الأخبار والأنشطة والفعاليات المدرسية.</p>
        </div>
    </div>

</body>
</html>
